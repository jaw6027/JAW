[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaw"
version = "0.1.0"
description = "A minimal Python starter project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jaw = "jaw.cli:main"

[tool.setuptools.packages.find]
include = ["jaw*"]
