<article class="design-card"><a class="card-image" href="{{ item.get_absolute_url }}"><img src="{{ item.cover_url }}" alt="{{ item.cover_alt }}" loading="lazy" width="560" height="680"><span class="image-badge">{% if item.is_sample %}SAMPLE DESIGN{% elif not item.cover %}PLACEHOLDER IMAGE{% else %}{{ item.style|upper }}{% endif %}</span><span class="image-arrow" aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4M4 4h12v12"/></svg></span></a><div class="card-meta"><span>{{ item.style }} / {{ item.color }}</span><time datetime="{{ item.published_at|date:'c' }}">{{ item.published_at|date:'M j' }}</time></div><h3><a href="{{ item.get_absolute_url }}">{{ item.title }}</a></h3><p>{{ item.description|truncatewords:15 }}</p></article>
