<form class="subscribe-form" action="{% url 'subscribe' %}" method="post">{% csrf_token %}
<label class="sr-only" for="email-{{ form_id }}">Your email address</label><div class="email-row"><input id="email-{{ form_id }}" type="email" name="email" placeholder="Your email address" autocomplete="email" maxlength="254" required><button type="submit">Count me in <span aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4M4 4h12v12"/></svg></span></button></div>
<div class="trap" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
<label class="consent"><input type="checkbox" name="consent" value="yes" required> <span>I agree to receive nail art emails. I can unsubscribe at any time. <a href="{% url 'privacy' %}">Privacy</a></span></label>
{% if not email_ready %}<p class="email-mode">Preview mode · Email isn’t connected yet. No addresses are saved or emails sent.</p>{% endif %}</form>
